<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credential Offer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .container {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
      }
      h1 {
        margin-bottom: 2rem;
        color: #333;
        text-align: center;
      }
      #login-section {
        display: block;
      }
      #authenticated-section {
        display: none;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-weight: 500;
      }
      input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
      }
      input:focus {
        outline: none;
        border-color: #4f60ff;
      }
      button {
        width: 100%;
        background: #4f60ff;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 2rem;
        font-size: 1rem;
        cursor: pointer;
        margin-bottom: 1rem;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        background: #3d4fcc;
      }
      #status {
        margin-bottom: 1.5rem;
        color: #666;
        min-height: 1.5rem;
        text-align: center;
      }
      #user-info {
        margin-bottom: 1rem;
        color: #333;
        font-weight: 500;
      }
      #qr-code {
        margin-top: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        background: white;
        display: none;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Credential Offer</h1>
      
      <!-- Login Section -->
      <div id="login-section">
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button type="submit">Login</button>
        </form>
      </div>

      <!-- Authenticated Section -->
      <div id="authenticated-section">
        <div id="user-info"></div>
        <div id="status">Authenticated! Click button to get credential offer.</div>
        <button id="get-offer">Get Credential Offer</button>
        <canvas id="qr-code"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
