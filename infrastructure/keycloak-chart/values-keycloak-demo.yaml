plugin:
  fileName: &pluginFileName keycloak-oid4vp-plugin-1.1.9.jar
  mountPath: &pluginMountPath /opt/keycloak/providers/keycloak-oid4vp-plugin-1.1.9.jar

createConfigMapJob:
  enabled: false

externalSecret:
  enabled: false

postgres:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - eu-central-1b

app-template:
  global:
    fullnameOverride: keycloak-demo
    namespaceOverride: datev-wallet
  controllers:
    main:
      serviceAccount:
        name: keycloak-demo-job-sa
      initContainers:
        wait-for-postgres:
          command:
          - sh
          - -c
          - |
            until kubectl get svc keycloak-demo-postgres -n datev-wallet; do
              echo "Waiting for PostgreSQL service..."; sleep 2;
            done
            until kubectl exec -n datev-wallet keycloak-demo-postgres-0 -- pg_isready -U datevadmin -d keycloakdb; do
              echo "Waiting for PostgreSQL to be ready..."; sleep 2;
            done
      containers:
        main:
          # Keep the official image ENTRYPOINT (kc.sh) and pass "start" as arguments.
          command: ["/opt/keycloak/bin/kc.sh"]
          args: ["start", "--features=oid4vc-vci"]
          image:
            repository: quay.io/keycloak/keycloak
            tag: 26.5.6
            pullPolicy: IfNotPresent
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: keycloak-demo-postgres
            - name: KC_DB_URL_DATABASE
              value: keycloakdb
            - name: KC_DB_USERNAME
              value: datevadmin
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KC_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            # Hostname/HTTPS for non-dev mode.
            - name: KC_HOSTNAME
              value: keycloak-demo.eudi-adorsys.com
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_PORT
              value: "8443"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/target/keycloak-server.crt.pem
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/target/keycloak-server.key.pem

  configMaps:
    keycloak-env-config:
      enabled: false
  secrets:
    keycloak-secret:
      enabled: false

  persistence:
    tls-volume:
      enabled: true
      type: secret
      name: keycloak-demo-local-tls
      globalMounts:
        - path: /opt/keycloak/target/keycloak-server.crt.pem
          subPath: tls.crt
          readOnly: true
        - path: /opt/keycloak/target/keycloak-server.key.pem
          subPath: tls.key
          readOnly: true
    providers-volume:
      enabled: true
      type: secret
      name: keycloak-providers
      globalMounts:
        - path: *pluginMountPath
          subPath: *pluginFileName
          readOnly: true

  ingress:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: keycloak-demo.eudi-adorsys.com
      hosts:
      - host: keycloak-demo.eudi-adorsys.com
        paths:
        - path: /
          pathType: Prefix

job:
  serviceAccountName: keycloak-demo-job-sa
  rbac:
    roleName: keycloak-demo-job-role
    roleBindingName: keycloak-demo-job-rolebinding

