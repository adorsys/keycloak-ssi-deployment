plugin:
  fileName: &pluginFileName keycloak-oid4vp-plugin-1.1.9.jar
  mountPath: &pluginMountPath /opt/keycloak/providers/keycloak-oid4vp-plugin-1.1.9.jar

createConfigMapJob:
  enabled: false

externalSecret:
  enabled: true
  metadata:
    name: pos-keycloak-external-secret
  spec:
    secretStoreRef:
      name: cash-registry-ui-secret-store
    target:
      name: pos-keycloak-secret

postgres:
  fullnameOverride: pos-keycloak-postgres
  auth:
    existingSecret: pos-keycloak-secret

app-template:
  global:
    fullnameOverride: pos-keycloak
    namespaceOverride: pos-demo
  controllers:
    main:
      serviceAccount:
        name: pos-keycloak-job-sa
      initContainers:
        wait-for-configmap:
          enabled: false
        wait-for-postgres:
          command:
            - sh
            - -c
            - |
              until kubectl get svc pos-keycloak-postgres -n pos-demo; do
                echo "Waiting for PostgreSQL service..."; sleep 2;
              done
              until kubectl exec -n pos-demo pos-keycloak-postgres-0 -- pg_isready -U datevadmin -d keycloakdb; do
                echo "Waiting for PostgreSQL to be ready..."; sleep 2;
              done
      containers:
        main:
          # Keep the official image ENTRYPOINT (kc.sh) and pass "start" as arguments.
          command: ["/opt/keycloak/bin/kc.sh"]
          args: ["start", "--features=oid4vc-vci"]
          image:
            repository: quay.io/keycloak/keycloak
            tag: 26.5.6
            pullPolicy: IfNotPresent
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: pos-keycloak-postgres
            - name: KC_DB_URL_DATABASE
              value: keycloakdb
            - name: KC_DB_USERNAME
              value: datevadmin
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pos-keycloak-secret
                  key: KC_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pos-keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            # Hostname/HTTPS for non-dev mode.
            - name: KC_HOSTNAME
              value: keycloak-pos.eudi-adorsys.com
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_PORT
              value: "8443"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/target/keycloak-server.crt.pem
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/target/keycloak-server.key.pem

  configMaps:
    keycloak-env-config:
      enabled: false
  secrets:
    keycloak-secret:
      enabled: false

  persistence:
    env-volume:
      enabled: false
    tls-volume:
      enabled: true
      type: secret
      name: pos-keycloak-local-tls
      globalMounts:
        - path: /opt/keycloak/target/keycloak-server.crt.pem
          subPath: tls.crt
          readOnly: true
        - path: /opt/keycloak/target/keycloak-server.key.pem
          subPath: tls.key
          readOnly: true
    providers-volume:
      enabled: true
      type: secret
      name: pos-keycloak-providers
      globalMounts:
        - path: *pluginMountPath
          subPath: *pluginFileName
          readOnly: true

  ingress:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: keycloak-pos.eudi-adorsys.com
      hosts:
        - host: keycloak-pos.eudi-adorsys.com
          paths:
            - path: /
              pathType: Prefix

job:
  serviceAccountName: pos-keycloak-job-sa
  rbac:
    roleName: pos-keycloak-job-role
    roleBindingName: pos-keycloak-job-rolebinding
