name: Publish Helm Chart as OCI Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Cache Helm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/helm
          key: ${{ runner.os }}-helm-${{ hashFiles('infrastructure/keycloak-chart/Chart.lock') }}
          restore-keys: |
            ${{ runner.os }}-helm-

      - name: Helm lint
        run: helm lint ./infrastructure/keycloak-chart

      - name: Package Helm chart
        run: |
          cd infrastructure/keycloak-chart
          helm dependency build
          helm package .
          mv keycloak-chart-*.tgz ../../ocr-keycloak.tgz

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm Chart to GHCR as OCI artifact
        run: |
          CHART_REPO="ghcr.io/${{ github.repository }}"
          helm push ./ocr-keycloak.tgz oci://$CHART_REPO/keycloak

      - name: Clean up
        run: rm -f ./ocr-keycloak.tgz
